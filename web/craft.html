<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ribcage craft page (3D)</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --fg:#e6e9ef; --dim:#8a93a3; --accent:#4aa3ff; --font:ui-monospace,Consolas,monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 var(--font); display:flex; flex-direction:column; }
  #bar { display:flex; gap:6px 14px; align-items:center; padding:8px 12px; flex-wrap:wrap; background:var(--panel); }
  .group { display:flex; gap:4px; align-items:center; }
  .group > span { color:var(--dim); margin-right:2px; }
  button, select { font:inherit; color:var(--fg); background:#232a35; border:1px solid #323a49; border-radius:4px; padding:3px 9px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.on { border-color:var(--accent); }
  label { color:var(--dim); display:flex; gap:4px; align-items:center; cursor:pointer; }
  label.filebtn { color:var(--fg); background:#232a35; border:1px solid #323a49; border-radius:4px; padding:3px 9px; }
  label.filebtn:hover { border-color:var(--accent); }
  #stage { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #status { padding:6px 12px; background:var(--panel); color:var(--dim); white-space:pre-wrap; min-height:2.8em; }
  #status b { color:var(--fg); font-weight:normal; }
  #readout { position:absolute; left:12px; top:10px; pointer-events:none; white-space:pre; background:#0e1116b3; padding:6px 10px; border-radius:4px; }
  #readout .dim { color:var(--dim); }
  #readout .warn { color:#ff9a3c; }
  #hint { position:absolute; left:12px; bottom:10px; color:var(--dim); pointer-events:none; max-width:70ch; }
  #legend { position:absolute; right:12px; top:10px; width:210px; pointer-events:none; color:var(--dim); font-size:12px; }
  #legend .ramp { height:8px; border-radius:4px; margin:3px 0; background:linear-gradient(90deg,#4aa3ff,#8a93a3,#ff5d5d); }
  #legend .row { display:flex; justify-content:space-between; }
  #legend .swatch { display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<div id="bar">
  <div class="group"><span>Fly</span>
    <button id="fly" title="The hopper on the pad: fly it with the throttle keys">Hopper</button>
    <button id="hop" title="The scripted hop: lift off, drift 7 m, cut the engine, hard landing (22 s)">Scripted hop</button>
  </div>
  <div class="group"><span>Drop</span>
    <button class="drop" data-speed="3" title="Drop the hopper to touch down at about 3 m/s">3 m/s</button>
    <button class="drop" data-speed="5" title="Drop the hopper to touch down at about 5 m/s">5 m/s</button>
    <button class="drop" data-speed="7" title="Drop the hopper to touch down at about 7 m/s">7 m/s</button>
    <select id="spot" title="Where on the field it falls"></select>
  </div>
  <div class="group"><span>Parts</span>
    <select id="part" title="One default part on its own on the pad"></select>
  </div>
  <div class="group"><span>Throttle</span>
    <button id="t-down" title="↓ or s">−</button>
    <button id="t-up" title="↑ or w">+</button>
    <button id="t-full" title="z">Full</button>
    <button id="t-cut" title="x">Cut</button>
  </div>
  <div class="group"><span>Time</span>
    <button id="pause" disabled title="space">Pause</button>
    <button id="step" disabled title=". : one step (1/60 s)">Step</button>
    <select id="rate" title="Simulation speed">
      <option value="2">2×</option>
      <option value="1" selected>1×</option>
      <option value="0.5">½×</option>
      <option value="0.25">¼×</option>
      <option value="0.1">0.1×</option>
    </select>
    <label title="Slows to 0.1× on the way down near the ground and for 2/3 s after the first touch (the pace only: the steps are the same)"><input type="checkbox" id="slow" checked> slow-mo at touchdown</label>
  </div>
  <div class="group"><span>Recording</span>
    <button id="save" disabled title="Download the last flight as a file: its commands and hash checkpoints">Save</button>
    <label class="filebtn" title="Replay a saved recording of this craft on a fresh world and check its hashes">Load…<input type="file" id="load" accept=".rcrd" hidden></label>
    <button id="sample" title="Replay the hard landing that ships with the page">Replay hard landing</button>
  </div>
  <div class="group"><span>Craft file</span>
    <button id="save-craft" title="Download the craft that is loaded as a craft file">Save</button>
    <label class="filebtn" title="Load a craft file and fly it">Load…<input type="file" id="load-craft" accept=".json,application/json" hidden></label>
  </div>
  <div class="group"><span>View</span>
    <label><input type="checkbox" id="beams" checked> beams</label>
    <label><input type="checkbox" id="panels" checked> panels</label>
    <label><input type="checkbox" id="nodes"> nodes</label>
    <label><input type="checkbox" id="stress" checked> stress colours</label>
    <label><input type="checkbox" id="follow" checked> follow</label>
    <button id="reset-view" title="Back to the starting view">Reset view</button>
  </div>
</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="readout"></div>
  <div id="hint">Throttle: ↑/w up, ↓/s down, z full, x cut. Space pauses, . steps once, r restarts. Drag to orbit, wheel to zoom.</div>
  <div id="legend">
    <div>beam stress (strain ÷ yield)</div>
    <div class="ramp"></div>
    <div class="row"><span>compression</span><span>0</span><span>yield</span></div>
    <div><span class="swatch" style="background:#d96bff"></span>bent past yield &nbsp;(broken beams are hidden)</div>
  </div>
</div>
<div id="status">loading…</div>
<script type="module" src="./craft3d.js"></script>
</body>
</html>
