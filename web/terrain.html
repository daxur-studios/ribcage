<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ribcage on terrain (3D)</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --fg:#e6e9ef; --dim:#8a93a3; --accent:#4aa3ff; --font:ui-monospace,Consolas,monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 var(--font); display:flex; flex-direction:column; }
  #bar { display:flex; gap:6px 14px; align-items:center; padding:8px 12px; flex-wrap:wrap; background:var(--panel); }
  .group { display:flex; gap:4px; align-items:center; }
  .group > span { color:var(--dim); margin-right:2px; }
  button, select { font:inherit; color:var(--fg); background:#232a35; border:1px solid #323a49; border-radius:4px; padding:3px 9px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  label { color:var(--dim); display:flex; gap:4px; align-items:center; cursor:pointer; }
  #stage { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #status { padding:6px 12px; background:var(--panel); color:var(--dim); white-space:pre-wrap; min-height:2.8em; }
  #status b { color:var(--fg); font-weight:normal; }
  #hint { position:absolute; left:12px; top:10px; color:var(--dim); pointer-events:none; max-width:60ch; }
  #legend { position:absolute; right:12px; top:10px; width:210px; pointer-events:none; color:var(--dim); font-size:12px; }
  #legend .ramp { height:8px; border-radius:4px; margin:3px 0; background:linear-gradient(90deg,#4aa3ff,#8a93a3,#ff5d5d); }
  #legend .row { display:flex; justify-content:space-between; }
  #legend .swatch { display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<div id="bar">
  <div class="group"><span>Scene</span>
    <select id="scene" title="What stands on the terrain">
      <option value="tower">tower on the plain</option>
      <option value="bridge">bridge over the valley</option>
    </select>
  </div>
  <div class="group"><span>Run</span>
    <button id="run">Run</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div class="group"><span>View</span>
    <label><input type="checkbox" id="nodes"> nodes</label>
    <button id="reset-view" title="Back to the starting view">Reset view</button>
  </div>
</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hint">Drag to orbit, wheel to zoom, right-drag to pan.</div>
  <div id="legend">
    <div>beam stress (strain ÷ yield)</div>
    <div class="ramp"></div>
    <div class="row"><span>compression</span><span>0</span><span>yield</span></div>
    <div><span class="swatch" style="background:#d96bff"></span>bent past yield &nbsp;(broken beams are hidden)</div>
  </div>
</div>
<div id="status">loading…</div>
<script type="module" src="./viewer3d.js"></script>
</body>
</html>
