<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ribcage bridge editor</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --fg:#e6e9ef; --dim:#8a93a3; --accent:#4aa3ff; --font:ui-monospace,Consolas,monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 var(--font); display:flex; flex-direction:column; }
  #bar { display:flex; gap:6px 14px; align-items:center; padding:8px 12px; flex-wrap:wrap; background:var(--panel); }
  .group { display:flex; gap:4px; align-items:center; }
  .group > span { color:var(--dim); margin-right:2px; }
  button, select { font:inherit; color:var(--fg); background:#232a35; border:1px solid #323a49; border-radius:4px; padding:3px 9px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.on { background:var(--accent); border-color:var(--accent); color:#06121f; }
  label { color:var(--dim); display:flex; gap:4px; align-items:center; cursor:pointer; }
  #stage { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #status { padding:6px 12px; background:var(--panel); color:var(--dim); white-space:pre-wrap; min-height:2.8em; }
  #status b { color:var(--fg); font-weight:normal; }
  #hint { position:absolute; left:12px; top:10px; color:var(--dim); pointer-events:none; max-width:60ch; }
  #legend { position:absolute; right:12px; top:10px; width:210px; pointer-events:none; color:var(--dim); font-size:12px; }
  #legend .ramp { height:8px; border-radius:4px; margin:3px 0; background:linear-gradient(90deg,#4aa3ff,#8a93a3,#ff5d5d); }
  #legend .row { display:flex; justify-content:space-between; }
  #legend .swatch { display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<div id="bar">
  <div class="group"><span>Tool</span>
    <button id="tool-node" data-tool="node" title="1: click empty space to place a node">Node</button>
    <button id="tool-beam" data-tool="beam" title="2: click two nodes to join them (empty space makes a node)">Beam</button>
    <button id="tool-pin" data-tool="pin" title="3: click a node to pin or free it">Pin</button>
    <button id="tool-delete" data-tool="delete" title="4: click a node or beam to remove it">Delete</button>
  </div>
  <div class="group"><span>Design</span>
    <button id="preset-bridge" title="A 24 m truss with a deck and two supports">Bridge</button>
    <button id="clear">Clear</button>
    <select id="material" title="What every beam is made of">
      <option value="strong">strong beams</option>
      <option value="weak">weak beams (a tenth as stiff)</option>
    </select>
  </div>
  <div class="group"><span>Run</span>
    <button id="run">Run</button>
    <button id="pause" disabled>Pause</button>
    <button id="step" disabled title=". : one step (1/60 s)">Step</button>
    <select id="speed" title="Simulation speed">
      <option value="2">2×</option>
      <option value="1" selected>1×</option>
      <option value="0.5">½×</option>
      <option value="0.25">¼×</option>
      <option value="0.1">0.1×</option>
    </select>
    <label><input type="checkbox" id="truck" checked> truck</label>
  </div>
</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hint"></div>
  <div id="legend">
    <div>beam stress (strain ÷ yield)</div>
    <div class="ramp"></div>
    <div class="row"><span>compression</span><span>0</span><span>yield</span></div>
    <div><span class="swatch" style="background:#d96bff"></span>bent past yield &nbsp;<span class="swatch" style="background:#555c69"></span>broken</div>
  </div>
</div>
<div id="status">loading…</div>
<script type="module" src="./editor.js"></script>
</body>
</html>
